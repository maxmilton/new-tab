"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = ["@maxmilton/*", "stage1"]

[test]
preload = ["./test/unit/setup.ts"]
root = "./test/unit"
