name: actionlint

on:
  push:
    branches:
      - master
      - next
    paths:
      - ".github/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Install ShellCheck
        env:
          # renovate: depName=koalaman/shellcheck
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tool_dir/archive.tar.xz" | sha256sum --check --strict
          tar -xJf "$tool_dir/archive.tar.xz" -C "$tool_dir" --strip-components=1 \
            "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/shellcheck" --version
      - name: Install actionlint
        env:
          # renovate: depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          version="${ACTIONLINT_VERSION#v}"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tool_dir/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/actionlint" -version
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json \
            --output "$RUNNER_TEMP/actionlint-matcher.json"
      - run: pipx install "ruff==${RUFF_VERSION}"
        env:
          # renovate: datasource=pypi depName=ruff
          RUFF_VERSION: 0.17.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow files
        run: |
          echo "::add-matcher::$RUNNER_TEMP/actionlint-matcher.json"
          actionlint -color -verbose -shellcheck shellcheck -pyflakes 'ruff check --isolated --select F,B,UP,SIM,PERF,RUF --output-format concise --stdin-filename "<stdin>" -'
      # - run: shellcheck --norc -a .github/scripts/*.sh
